[project]
name = "recdyud"
version = "0.1.0"
description = "recpt1-style tuner command for the DY-UD200 ISDB-T USB tuner (for mirakc)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "elderica", email = "1130138+elderica@users.noreply.github.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "cryptography>=50.0.1",
    "numpy>=2.5.3",
    "pyusb>=1.3.1",
]

[project.scripts]
recdyud = "recdyud.cli:main"
recdyud-diag = "recdyud.diag:main"

[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/recdyud"]
# The native libraries are loaded with ctypes and do not use the CPython ABI.
wheel.py-api = "py3"
cmake.build-type = "Release"
sdist.include = ["vendor/libaribb25/**", "vendor/libusb-cmake/**"]
sdist.exclude = ["BonDriver_dyud_test_source/**", ".github/**"]

[tool.uv]
# Rebuild the native part when any of these change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "native/**" },
    { git = { commit = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor", "BonDriver_dyud_test_source"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
